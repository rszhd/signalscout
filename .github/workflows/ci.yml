name: CI

on:
  pull_request:
  # A push to main publishes the image self-hosters pull. Until US-155 the two
  # deploy workflows called this one and a push list would have run it twice
  # for one commit; they live in the cloud repository now, and nothing else
  # publishes `:latest`.
  push:
    branches: [main]
  # Called by the release workflow, so a tag whose checks never ran cannot
  # publish a package.
  workflow_call:
    outputs:
      digest:
        description: The digest of the image this run published
        value: ${{ jobs.image.outputs.digest }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: intentwatch
          POSTGRES_PASSWORD: intentwatch
          POSTGRES_DB: intentwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intentwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgres://intentwatch:intentwatch@localhost:5432/intentwatch

    steps:
      - uses: actions/checkout@v5

      - run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: The backlog lists match the ticket files
        run: backlog/index.sh --check

      # The DCO is the whole contribution agreement, so a commit without the
      # line has no agreement. Checked on pull requests from a fork only:
      # the owner's release branches carry commits from before the rule and
      # the commit-msg hook covers the owner from now on. AI_POLICY.md,
      # US-300.
      - name: Every commit from outside is signed off
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        # Through the API, because the checkout is one commit deep and the
        # base is not in it.
        run: |
          unsigned=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits" --paginate \
            -q '.[] | select(.commit.message | test("Signed-off-by:") | not) | "\(.sha) \(.commit.message | split("\n")[0])"')
          if [ -n "$unsigned" ]; then
            echo "::error::A commit lacks Signed-off-by. Use git commit -s. See CONTRIBUTING.md."
            echo "$unsigned"
            exit 1
          fi

      - run: pnpm lint
      # Biome has no rule for a raw colour or a raw spacing value, and those
      # are what keep two applications on one brand. US-270.
      - run: pnpm lint:css
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

      # What `pnpm publish` would ship, installed into an empty project and
      # used from there. Nothing else in the suite imports the built packages,
      # so this is the only check that the published shape works. US-154.
      - name: The packed packages install and work outside the workspace
        run: pnpm release:verify

      - name: The packed brand package installs and works outside the workspace
        run: pnpm release:verify:ui

  image:
    name: Build and publish the image
    runs-on: ubuntu-latest
    needs: check

    permissions:
      contents: read
      packages: write

    outputs:
      # What a deployment must end up running. A tag is a mutable pointer and a
      # digest is not, so this is the only value that lets a deploy prove it
      # took the build rather than whatever the box had already pulled.
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Pull requests build the image to prove the Dockerfile still works. A
      # push to main publishes it, because that is what a self-hoster pulls.
      - name: Log in to the registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # `main` by name, not `is_default_branch`. That macro reads a
            # setting in a web interface: this repository's default is `dev`,
            # which CI never runs on, so the condition was false on every run
            # that could publish and `:latest` was never made — while
            # docker-compose.yml asked for it by default and README.md told
            # people to run it.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
