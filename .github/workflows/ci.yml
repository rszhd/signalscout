name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by deploy-staging.yml, so a commit whose checks never ran cannot
  # reach a box. That is a property of the job graph rather than a convention
  # somebody keeps. `staging` is deliberately absent from the push list above:
  # it would run this file twice for one commit, and the second run would
  # publish the same tag from the same source for nobody.
  workflow_call:
    outputs:
      digest:
        description: The digest of the image this run published
        value: ${{ jobs.image.outputs.digest }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: intentwatch
          POSTGRES_PASSWORD: intentwatch
          POSTGRES_DB: intentwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intentwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgres://intentwatch:intentwatch@localhost:5432/intentwatch

    steps:
      - uses: actions/checkout@v5

      - run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: The backlog lists match the ticket files
        run: backlog/index.sh --check

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  image:
    name: Build and publish the image
    runs-on: ubuntu-latest
    needs: check

    permissions:
      contents: read
      packages: write

    outputs:
      # What a deployment must end up running. A tag is a mutable pointer and a
      # digest is not, so this is the only value that lets a deploy prove it
      # took the build rather than whatever the box had already pulled.
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Pull requests build the image to prove the Dockerfile still works. A
      # push publishes it, because that is what a server pulls. Staging runs
      # every check main runs and publishes under its own tag, so the thing
      # tested on staging is the same artifact main will later carry.
      - name: Log in to the registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}
            type=sha,format=long

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
