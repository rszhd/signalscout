name: Release

# A version is a tag. Pushing `v1.2.3` runs every check main runs, builds the
# image, and then publishes @signalscout/engine and @signalscout/pipeline to
# npm at 1.2.3 — both, at one version, because the pipeline depends on the
# engine at that exact version and nothing has tested them mixed. A tag that
# is not on main is refused: a release is a commit main has, or it is not a
# release. docs/releasing.md says how to cut one. US-154.
#
# @signalscout/ui is not here. It carries its own number on its own tag,
# `ui-v1.2.3`, in `release-ui.yml`: a colour must not cost the pipeline a
# version nobody can explain. US-270.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  on-main:
    name: The tag points at a commit on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: |
          git fetch origin main --depth=1000
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main. Merge first, then tag."
            exit 1
          fi

  ci:
    needs: on-main
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write

  publish:
    name: Publish both packages to npm
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    # The same Postgres the check job has, because release:verify runs the
    # pipeline's migrations from the packed tarball against a real database.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: intentwatch
          POSTGRES_PASSWORD: intentwatch
          POSTGRES_DB: intentwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intentwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v5

      - run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The tag is the version. The manifests say 0.0.0 in git on purpose:
      # a number in a file is a number somebody forgets to move, and two
      # packages with two numbers would say they can be mixed.
      - name: Set both versions from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          for package in engine pipeline; do
            (cd "packages/$package" && pnpm version "$version" --no-git-tag-version)
          done

      - name: The packed packages install and work outside the workspace
        run: pnpm release:verify
        env:
          DATABASE_URL: postgres://intentwatch:intentwatch@localhost:5432/intentwatch

      # No token. Each package on npm lists this repository and this workflow
      # file as a trusted publisher, and npm accepts the job's OIDC token in
      # place of a secret — that is what `id-token: write` above is for, and
      # why `registry-url` is set on the Node step. US-156.
      # Named rather than globbed: `./packages/*` would publish the UI package
      # at this number too, and it has a series of its own. US-270.
      - name: Publish
        run: |
          pnpm --filter @signalscout/engine --filter @signalscout/pipeline \
            publish --access public --no-git-checks --provenance

  # The image the tag names, so a self-hoster can pin one. CI publishes
  # `:latest` and `:sha-…` on every push to main; neither says which version
  # it is, and docker-compose.yml's SIGNALSCOUT_IMAGE is the documented way
  # to pin. The build is cached from CI's, so this re-tags rather than
  # recompiles. US-295.
  image:
    name: Tag the image with the version
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Both architectures, unconditionally: a pinned version that exists for
      # one of them is worse than no pinned version. US-306.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `0.13.1` and `0.13`. Not `latest`: that is main's, and a tag can
          # point at a commit main has moved past.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # GitHub may not recognise the FSL, and this label would then
          # carry whatever it guessed from the repository (US-379).
          labels: |
            org.opencontainers.image.licenses=FSL-1.1-ALv2

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # After npm has it, the Releases page says so. The body is the tag's
  # CHANGELOG.md section, and a tag without one fails here rather than
  # publish a Release that says nothing — the changelog is written for
  # exactly this reader. Last, so a refused publish leaves no Release
  # claiming a version npm does not have. US-293.
  release:
    name: Publish the GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: The changelog has this version
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md
      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
