<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Find people publicly talking about the problem your product solves."
    />
    <meta name="theme-color" content="#171a18" />

    <!--
      The link preview. A scraper has no page to resolve a relative image
      against, so `og:image` is absolute; the card lives on the marketing site,
      which is where the product's public face is.
    -->
    <meta property="og:site_name" content="SignalScout" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SignalScout — Find the people already asking for what you built" />
    <meta
      property="og:description"
      content="Find people publicly talking about the problem your product solves."
    />
    <meta property="og:image" content="https://www.signalscout.run/og.png" />
    <meta property="og:image:secure_url" content="https://www.signalscout.run/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="3200" />
    <meta property="og:image:height" content="1664" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="SignalScout — Find the people already asking for what you built"
    />
    <meta
      name="twitter:description"
      content="Find people publicly talking about the problem your product solves."
    />
    <meta name="twitter:image" content="https://www.signalscout.run/og.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SignalScout</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
