# `docker compose up` runs the whole product: Postgres, the migrations, and one
# Node process serving the API and the built UI on one port.
#
# The app image is pulled, never built here. It is built in CI and published, so
# a 1 GB server never compiles anything. To build it yourself:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build

# The product was renamed to SignalScout, and this line was deliberately not
# renamed with it. Compose prefixes its volumes with this name, so changing it
# points `postgres-data` at a new empty volume and an existing instance comes up
# with no data. The same reason keeps the Postgres role and database below.
name: intentwatch

x-app-environment: &app-environment
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HOST: 0.0.0.0
  PORT: ${PORT:-3000}
  DATABASE_URL: postgres://${POSTGRES_USER:-intentwatch}:${POSTGRES_PASSWORD:-intentwatch}@postgres:5432/${POSTGRES_DB:-intentwatch}
  # Signs the session cookie. The app refuses to start without it, because an
  # instance with no login serves its inbox and its keys to whoever finds the
  # port. `openssl rand -base64 32`.
  AUTH_SECRET: ${AUTH_SECRET:-}
  # closed | open. Closed is the self-hosted default: one account, and the
  # server refuses every attempt after it. See .env.example.
  AUTH_SIGNUP: ${AUTH_SIGNUP:-closed}
  # Set it when a proxy rewrites the host. Empty means "read it per request".
  AUTH_URL: ${AUTH_URL:-}
  # Origins allowed to sign in, besides this instance's own. Comma separated.
  AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-}
  # Empty until a credential is stored in the database. docs/secrets.md.
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}

  # What the hosted version charges with. `off` on every self-hosted instance,
  # which is why it is the default here and in the schema. US-072.
  #
  # A missing line in this block is not a missing setting — it is a setting
  # that CANNOT be made. Compose reads `.env` to interpolate values into the
  # lines below, so a variable named nowhere here never reaches the container,
  # whatever anybody writes. That is how BILLING_MODE=stripe came to be
  # readable by nothing: the instance booted in `off` mode, every screen
  # worked, and the boot check that exists for exactly this could not fire.
  # `compose-environment.test.ts` is what keeps this list level with the schema.
  BILLING_MODE: ${BILLING_MODE:-off}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  # Where Checkout sends a person back to. Required with BILLING_MODE=stripe.
  APP_URL: ${APP_URL:-}

  # The model settings. An account can store its own on the settings screen
  # since US-068, and these are what an instance falls back to.
  AI_PROVIDER: ${AI_PROVIDER:-}
  AI_MODEL: ${AI_MODEL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-}
  AI_INPUT_PRICE_MICROS: ${AI_INPUT_PRICE_MICROS:-}
  AI_OUTPUT_PRICE_MICROS: ${AI_OUTPUT_PRICE_MICROS:-}
  AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-}
  AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
  AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
  AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-}
  AI_EMBEDDING_PRICE_MICROS: ${AI_EMBEDDING_PRICE_MICROS:-}
  AI_TRIAGE_PROVIDER: ${AI_TRIAGE_PROVIDER:-}
  AI_TRIAGE_MODEL: ${AI_TRIAGE_MODEL:-}
  AI_TRIAGE_API_KEY: ${AI_TRIAGE_API_KEY:-}
  AI_TRIAGE_BASE_URL: ${AI_TRIAGE_BASE_URL:-}
  AI_TRIAGE_INPUT_PRICE_MICROS: ${AI_TRIAGE_INPUT_PRICE_MICROS:-}
  AI_TRIAGE_OUTPUT_PRICE_MICROS: ${AI_TRIAGE_OUTPUT_PRICE_MICROS:-}
  AI_DRAFT_PROVIDER: ${AI_DRAFT_PROVIDER:-}
  AI_DRAFT_MODEL: ${AI_DRAFT_MODEL:-}
  AI_DRAFT_API_KEY: ${AI_DRAFT_API_KEY:-}
  AI_DRAFT_BASE_URL: ${AI_DRAFT_BASE_URL:-}
  AI_DRAFT_INPUT_PRICE_MICROS: ${AI_DRAFT_INPUT_PRICE_MICROS:-}
  AI_DRAFT_OUTPUT_PRICE_MICROS: ${AI_DRAFT_OUTPUT_PRICE_MICROS:-}

  # One per provider in the registry, named by `environmentVariableFor`. A key
  # stored on the connections screen is read first; this is the machine's copy
  # and the only one a fresh instance has. docs/secrets.md.
  BRIGHTDATA_API_KEY: ${BRIGHTDATA_API_KEY:-}
  SCRAPECREATORS_API_KEY: ${SCRAPECREATORS_API_KEY:-}
  SOCIALCRAWL_API_KEY: ${SOCIALCRAWL_API_KEY:-}
  SOCIALDATA_API_KEY: ${SOCIALDATA_API_KEY:-}
  APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intentwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intentwatch}
      POSTGRES_DB: ${POSTGRES_DB:-intentwatch}
    # Bound to loopback: the app reaches Postgres over the compose network, and
    # this port exists only so `pnpm dev` and `pnpm test` can reach it.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intentwatch} -d ${POSTGRES_DB:-intentwatch}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Runs to completion before anything connects. Two processes applying the
  # same migrations at boot is a race nobody needs.
  migrate:
    image: ${SIGNALSCOUT_IMAGE:-ghcr.io/rszhd/signalscout:latest}
    command: ["node", "packages/core/dist/db/migrate-cli.js"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: ${SIGNALSCOUT_IMAGE:-ghcr.io/rszhd/signalscout:latest}
    environment:
      <<: *app-environment
      WORKER_IN_PROCESS: ${WORKER_IN_PROCESS:-true}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Started only when COMPOSE_PROFILES=worker. Set that together with
  # WORKER_IN_PROCESS=false; on their own, either one leaves you with no worker
  # or with two.
  worker:
    profiles: ["worker"]
    image: ${SIGNALSCOUT_IMAGE:-ghcr.io/rszhd/signalscout:latest}
    command: ["node", "apps/worker/dist/index.js"]
    environment:
      <<: *app-environment
      WORKER_IN_PROCESS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
